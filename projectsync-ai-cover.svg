<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ProjectSync AI workflow</title>
  <desc id="desc">A workflow from work documents to an editable summary and safe write-back</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef4ff"/><stop offset="1" stop-color="#dfe8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#274caa" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="80" r="210" fill="#cbd9ff" opacity=".5"/><circle cx="120" cy="820" r="250" fill="#d4f1ec" opacity=".7"/>
  <text x="90" y="112" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#243452">PROJECTSYNC AI</text>
  <text x="90" y="162" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#1f315b">从工作事实到可确认总结</text>
  <text x="94" y="205" font-family="Arial, sans-serif" font-size="22" fill="#60708d">多源资料整理 · 个人贡献识别 · 日报周报生成 · 安全写回</text>
  <g filter="url(#shadow)">
    <rect x="86" y="310" width="280" height="300" rx="24" fill="#fff"/>
    <rect x="420" y="310" width="280" height="300" rx="24" fill="#fff"/>
    <rect x="754" y="310" width="280" height="300" rx="24" fill="#fff"/>
    <rect x="1088" y="310" width="420" height="300" rx="24" fill="#fff"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="116" y="365" font-size="17" font-weight="700" fill="#5575d7">01 · 输入</text>
    <text x="116" y="414" font-size="29" font-weight="700" fill="#263653">工作资料</text>
    <text x="116" y="463" font-size="17" fill="#718099">项目计划</text><text x="116" y="500" font-size="17" fill="#718099">会议纪要</text><text x="116" y="537" font-size="17" fill="#718099">在线文档 / 日历</text>
    <text x="450" y="365" font-size="17" font-weight="700" fill="#5575d7">02 · 识别</text>
    <text x="450" y="414" font-size="29" font-weight="700" fill="#263653">ProjectSync</text>
    <text x="450" y="463" font-size="17" fill="#718099">关联项目与业务</text><text x="450" y="500" font-size="17" fill="#718099">识别个人贡献</text><text x="450" y="537" font-size="17" fill="#718099">标记待核验事项</text>
    <text x="784" y="365" font-size="17" font-weight="700" fill="#2b9a8b">03 · 生成</text>
    <text x="784" y="414" font-size="29" font-weight="700" fill="#263653">可编辑草稿</text>
    <rect x="784" y="447" width="210" height="42" rx="9" fill="#edf3ff"/><text x="804" y="475" font-size="17" fill="#456bd0">今日日报</text>
    <rect x="784" y="502" width="210" height="42" rx="9" fill="#e8f7f3"/><text x="804" y="530" font-size="17" fill="#258a7d">本周周报</text>
    <text x="1118" y="365" font-size="17" font-weight="700" fill="#2b9a8b">04 · 确认</text>
    <text x="1118" y="414" font-size="29" font-weight="700" fill="#263653">安全写回原文档</text>
    <text x="1118" y="466" font-size="17" fill="#718099">自然语言修改后再确认</text>
    <text x="1118" y="504" font-size="17" fill="#718099">只更新本人负责的条目</text>
    <rect x="1118" y="536" width="225" height="42" rx="9" fill="#2f73e8"/><text x="1150" y="564" font-size="17" font-weight="700" fill="#fff">确认并写回</text>
  </g>
  <g stroke="#7894e5" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M370 460h38"/><path d="M704 460h38"/><path d="M1038 460h38"/></g>
  <g fill="#7894e5"><path d="m402 442 26 18-26 18z"/><path d="m736 442 26 18-26 18z"/><path d="m1070 442 26 18-26 18z"/></g>
  <text x="90" y="790" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5575d7">AI PRODUCT · PRODUCT MANAGEMENT · VIBECODING</text>
</svg>
